<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de QR — Valeria Maximiliana</title>
<meta name="description" content="Genera un código QR que apunte al sitio de Valeria Maximiliana para compartirlo fácilmente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Quicksand:wght@400;500;600;700&family=Rye&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--gradient-hero);
        padding: var(--space-sm);
    }
    .qr-card {
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-strong);
        padding: var(--space-lg);
        max-width: 420px;
        width: 100%;
        text-align: center;
    }
    .qr-card h1 {
        font-size: 1.6rem;
        margin-bottom: 0.3rem;
    }
    .qr-card p.subtitle {
        color: var(--color-text-soft);
        margin-bottom: var(--space-md);
        font-size: 0.95rem;
    }
    .qr-field {
        width: 100%;
        padding: 0.85rem 1rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        font-family: var(--font-body);
        font-size: 1rem;
        margin-bottom: var(--space-sm);
    }
    .qr-field:focus-visible {
        outline: 2px solid var(--color-secondary-dark);
        outline-offset: 2px;
    }
    #qr-output {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 220px;
        margin: var(--space-md) 0;
    }
    #qr-output canvas, #qr-output img {
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-soft);
        background: #fff;
        padding: 10px;
    }
    .qr-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        justify-content: center;
    }
    .qr-hint {
        margin-top: var(--space-md);
        font-size: 0.85rem;
        color: var(--color-text-soft);
    }
    .back-link {
        display: inline-block;
        margin-top: var(--space-md);
        font-size: 0.9rem;
        color: var(--color-primary-dark);
        text-decoration: underline;
    }
    #download-btn[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
    }
    #download-btn.is-working {
        opacity: 0.85;
    }
</style>
</head>
<body>

<div class="qr-card">
    <p class="eyebrow">Compartir</p>
    <h1>Generador de código QR</h1>
    <p class="subtitle">Crea un QR que lleve directo a la historia de Valeria Maximiliana.</p>

    <label for="qr-url" class="visually-hidden">URL del sitio</label>
    <input type="url" id="qr-url" class="qr-field" placeholder="https://usuario.github.io/valeria/" value="https://usuario.github.io/valeria/">

    <div class="qr-actions">
        <button type="button" class="btn btn-primary" id="generate-btn">Generar QR</button>
        <button type="button" class="btn btn-outline" id="download-btn" disabled>Guardar imagen</button>
    </div>

    <div id="qr-output" aria-live="polite"></div>

    <p class="qr-hint">El código se genera completamente en tu navegador: la URL nunca se envía a ningún servidor.</p>
    <a href="index.html" class="back-link">← Volver a la historia de Valeria</a>
</div>

<script src="js/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
    "use strict";

    const urlInput = document.getElementById("qr-url");
    const output = document.getElementById("qr-output");
    const generateBtn = document.getElementById("generate-btn");
    const downloadBtn = document.getElementById("download-btn");
    let qrInstance = null;

    /** Ruta de la fotografía de nacimiento usada en la tarjeta para guardar. */
    const FOTO_TARJETA = "assets/fotos/nacimiento/bebe_recien_nacida_envuelta_blanco.jpg";

    /** Dedicatoria que acompaña la tarjeta. Fácilmente editable. */
    const DEDICATORIA = "En tu sonrisa encuentro mi paz y en tu mirada, mi esperanza. Que el mundo sea siempre amable contigo, y que nunca te falte la certeza de lo inmensamente amada que eres.";

    function generarQR() {
        const value = urlInput.value.trim();
        if (!value) {
            urlInput.focus();
            return;
        }
        if (typeof QRCode === "undefined") {
            output.innerHTML = "<p style='color:var(--color-text-soft);font-size:0.9rem;'>No se pudo cargar la librería de generación de QR. Verifica tu conexión a internet e intenta nuevamente.</p>";
            downloadBtn.disabled = true;
            return;
        }
        output.innerHTML = "";
        qrInstance = new QRCode(output, {
            text: value,
            width: 260,
            height: 260,
            colorDark: "#4a3b4c",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
        downloadBtn.disabled = false;
    }

    /* ============================================================
       TARJETA PARA GUARDAR
       Compone en un <canvas> de alta resolución: fotografía de
       nacimiento + nombre + dedicatoria + código QR, con un diseño
       propio (no es solo el QR suelto).
       ============================================================ */

    function cargarImagen(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = src;
        });
    }

    function obtenerFuenteQR() {
        const canvas = output.querySelector("canvas");
        if (canvas) return canvas;
        const img = output.querySelector("img");
        return img || null;
    }

    /** Dibuja un rectángulo con esquinas redondeadas (ruta reutilizable). */
    function trazarRectRedondeado(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    /** Dibuja una imagen recortada tipo "cover" dentro de un círculo. */
    function dibujarImagenCoverCirculo(ctx, img, cx, cy, radio) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radio, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        const diametro = radio * 2;
        const escala = Math.max(diametro / img.width, diametro / img.height);
        const anchoDestino = img.width * escala;
        const altoDestino = img.height * escala;
        const dx = cx - anchoDestino / 2;
        const dy = cy - altoDestino / 2;

        ctx.drawImage(img, dx, dy, anchoDestino, altoDestino);
        ctx.restore();
    }

    /** Dibuja un pequeño ramo floral (emoji) para decorar una esquina.
     * Los desplazamientos están pensados para la esquina superior izquierda;
     * se reflejan con ctx.scale() para las demás esquinas. */
    function dibujarRamoEsquina(ctx, x, y, invertirX, invertirY) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(invertirX ? -1 : 1, invertirY ? -1 : 1);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const piezas = [
            { e: "🌸", dx: 14, dy: 14, s: 50, r: -12 },
            { e: "🌷", dx: 52, dy: 30, s: 42, r: 8 },
            { e: "🌸", dx: 30, dy: 54, s: 34, r: 4 },
            { e: "🌿", dx: 66, dy: 8, s: 38, r: 20 },
            { e: "🌿", dx: 8, dy: 58, s: 34, r: -18 }
        ];

        piezas.forEach((p) => {
            ctx.save();
            ctx.translate(p.dx, p.dy);
            ctx.rotate((p.r * Math.PI) / 180);
            ctx.font = p.s + "px serif";
            ctx.fillText(p.e, 0, 0);
            ctx.restore();
        });
        ctx.restore();
    }

    /** Mide cuántas líneas ocupará un texto envuelto, sin dibujarlo. */
    function medirLineasEnvueltas(ctx, texto, anchoMax) {
        const palabras = texto.split(" ");
        let linea = "";
        let lineas = 0;

        palabras.forEach((palabra, i) => {
            const pruebaLinea = linea ? linea + " " + palabra : palabra;
            if (ctx.measureText(pruebaLinea).width > anchoMax && linea) {
                lineas++;
                linea = palabra;
            } else {
                linea = pruebaLinea;
            }
            if (i === palabras.length - 1) lineas++;
        });

        return lineas;
    }

    /** Dibuja texto centrado con espaciado manual entre letras (canvas no soporta letter-spacing). */
    function dibujarTextoEspaciado(ctx, texto, centroX, y, espaciado) {
        const anchos = [...texto].map((c) => ctx.measureText(c).width);
        const anchoTotal = anchos.reduce((a, b) => a + b, 0) + espaciado * (texto.length - 1);
        let cursorX = centroX - anchoTotal / 2;
        [...texto].forEach((c, i) => {
            ctx.fillText(c, cursorX + anchos[i] / 2, y);
            cursorX += anchos[i] + espaciado;
        });
    }

    /** Envuelve texto centrado dentro de un ancho máximo y devuelve la siguiente coordenada Y. */
    function dibujarTextoEnvuelto(ctx, texto, centroX, y, anchoMax, altoLinea) {
        const palabras = texto.split(" ");
        let linea = "";
        let cursorY = y;

        palabras.forEach((palabra, i) => {
            const pruebaLinea = linea ? linea + " " + palabra : palabra;
            if (ctx.measureText(pruebaLinea).width > anchoMax && linea) {
                ctx.fillText(linea, centroX, cursorY);
                linea = palabra;
                cursorY += altoLinea;
            } else {
                linea = pruebaLinea;
            }
            if (i === palabras.length - 1) {
                ctx.fillText(linea, centroX, cursorY);
            }
        });

        return cursorY + altoLinea;
    }

    /** Dibuja un pequeño corazón relleno (para acentos decorativos). */
    function dibujarCorazon(ctx, cx, cy, tamano, color) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        const top = cy - tamano * 0.35;
        ctx.moveTo(cx, top + tamano * 0.35);
        ctx.bezierCurveTo(cx, top, cx - tamano, top, cx - tamano, top + tamano * 0.35);
        ctx.bezierCurveTo(cx - tamano, top + tamano * 0.75, cx, top + tamano, cx, top + tamano * 1.35);
        ctx.bezierCurveTo(cx, top + tamano, cx + tamano, top + tamano * 0.75, cx + tamano, top + tamano * 0.35);
        ctx.bezierCurveTo(cx + tamano, top, cx, top, cx, top + tamano * 0.35);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    const FUENTE_NOMBRE = "58px 'Rye', 'Copperplate', Georgia, serif";
    const FUENTE_DEDICATORIA = "italic 500 29px 'Playfair Display', Georgia, serif";

    async function construirTarjeta() {
        const fuenteQR = obtenerFuenteQR();
        if (!fuenteQR) return null;

        // Nos aseguramos de que las tipografías estén cargadas antes de dibujar texto.
        await Promise.all([
            document.fonts.load(FUENTE_NOMBRE),
            document.fonts.load("italic 500 32px 'Playfair Display'"),
            document.fonts.load(FUENTE_DEDICATORIA),
            document.fonts.load("600 24px 'Quicksand'")
        ]).catch(() => {});

        const foto = await cargarImagen(FOTO_TARJETA);

        const W = 1080;
        const margen = 60;
        const cardW = W - margen * 2;
        const centroX = W / 2;
        const anchoTextoDedicatoria = cardW - 240;

        // ---------- Medimos la dedicatoria de antemano para calcular el alto total ----------
        const medidor = document.createElement("canvas").getContext("2d");
        medidor.font = FUENTE_DEDICATORIA;
        const lineasDedicatoria = medirLineasEnvueltas(medidor, DEDICATORIA, anchoTextoDedicatoria);
        const altoLineaDedicatoria = 44;

        const fotoRadio = 210;
        const alturaFoto = fotoRadio * 2;
        const alturaEncabezado = 70 + alturaFoto + 70 + 58 + 46 + 34 + 30; // margen + foto + nombre + subtítulo + divisor
        const alturaDedicatoria = lineasDedicatoria * altoLineaDedicatoria + 40;
        const alturaQR = 40 + 320 + 54 + 34 + 30 + 50; // caja qr + pie + margen inferior

        const cardH = alturaEncabezado + alturaDedicatoria + alturaQR;
        const H = cardH + margen * 2;

        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");

        // ---------- Fondo con degradado suave (paleta del sitio) ----------
        const fondo = ctx.createLinearGradient(0, 0, W, H);
        fondo.addColorStop(0, "#fdf2f6");
        fondo.addColorStop(0.5, "#f3e6f7");
        fondo.addColorStop(1, "#eee0f6");
        ctx.fillStyle = fondo;
        ctx.fillRect(0, 0, W, H);

        // Pequeños destellos decorativos dispersos en el fondo.
        const destellos = [
            [90, 120], [980, 90], [70, H - 300], [1000, H - 420], [60, H - 90], [1010, H - 60]
        ];
        destellos.forEach(([dx, dy], i) => {
            ctx.save();
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = i % 2 === 0 ? "#e3c68a" : "#c9b6e4";
            ctx.beginPath();
            ctx.arc(dx, dy, 5 + (i % 3) * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // ---------- Tarjeta blanca central con sombra suave ----------
        const cardX = margen;
        const cardY = margen;

        ctx.save();
        ctx.shadowColor = "rgba(90, 60, 90, 0.28)";
        ctx.shadowBlur = 45;
        ctx.shadowOffsetY = 18;
        ctx.fillStyle = "#fffaf6";
        trazarRectRedondeado(ctx, cardX, cardY, cardW, cardH, 46);
        ctx.fill();
        ctx.restore();

        // Borde dorado sutil.
        ctx.save();
        trazarRectRedondeado(ctx, cardX + 3, cardY + 3, cardW - 6, cardH - 6, 44);
        ctx.strokeStyle = "rgba(227, 198, 138, 0.55)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // ---------- Ramos florales en las cuatro esquinas ----------
        ctx.save();
        trazarRectRedondeado(ctx, cardX, cardY, cardW, cardH, 46);
        ctx.clip();
        dibujarRamoEsquina(ctx, cardX - 6, cardY - 6, false, false);
        dibujarRamoEsquina(ctx, cardX + cardW + 6, cardY - 6, true, false);
        dibujarRamoEsquina(ctx, cardX - 6, cardY + cardH + 6, false, true);
        dibujarRamoEsquina(ctx, cardX + cardW + 6, cardY + cardH + 6, true, true);
        ctx.restore();

        // ---------- Fotografía circular ----------
        const fotoCX = centroX;
        const fotoCY = cardY + 70 + fotoRadio;

        // Anillo blanco detrás de la foto, a modo de marco.
        ctx.save();
        ctx.shadowColor = "rgba(90, 60, 90, 0.25)";
        ctx.shadowBlur = 30;
        ctx.shadowOffsetY = 12;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(fotoCX, fotoCY, fotoRadio + 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Segundo anillo, dorado, muy fino, como detalle extra.
        ctx.save();
        ctx.strokeStyle = "rgba(227, 198, 138, 0.85)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(fotoCX, fotoCY, fotoRadio + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        dibujarImagenCoverCirculo(ctx, foto, fotoCX, fotoCY, fotoRadio);

        let cursorY = fotoCY + fotoRadio + 76;

        // ---------- Nombre (tipografía decorativa, estilo cartel antiguo) ----------
        ctx.textAlign = "center";
        ctx.fillStyle = "#c98da8";
        ctx.font = FUENTE_NOMBRE;
        dibujarTextoEspaciado(ctx, "VALERIA MAXIMILIANA", centroX, cursorY, 3);

        cursorY += 48;
        ctx.fillStyle = "#a68fce";
        ctx.font = "italic 500 32px 'Playfair Display', Georgia, serif";
        ctx.fillText("Mi pequeña princesa", centroX, cursorY);

        // ---------- Divider ornamental ----------
        cursorY += 46;
        ctx.save();
        ctx.strokeStyle = "rgba(227, 198, 138, 0.8)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centroX - 150, cursorY);
        ctx.lineTo(centroX - 26, cursorY);
        ctx.moveTo(centroX + 26, cursorY);
        ctx.lineTo(centroX + 150, cursorY);
        ctx.stroke();
        ctx.restore();
        dibujarCorazon(ctx, centroX, cursorY - 10, 13, "#e8b4c8");

        // ---------- Dedicatoria ----------
        cursorY += 56;
        ctx.fillStyle = "#4a3b4c";
        ctx.font = FUENTE_DEDICATORIA;
        cursorY = dibujarTextoEnvuelto(ctx, DEDICATORIA, centroX, cursorY, anchoTextoDedicatoria, altoLineaDedicatoria);

        // ---------- Tarjeta blanca para el QR ----------
        cursorY += 40;
        const qrBoxTam = 320;
        const qrBoxX = centroX - qrBoxTam / 2;
        const qrBoxY = cursorY;

        ctx.save();
        ctx.shadowColor = "rgba(90, 60, 90, 0.2)";
        ctx.shadowBlur = 26;
        ctx.shadowOffsetY = 10;
        ctx.fillStyle = "#ffffff";
        trazarRectRedondeado(ctx, qrBoxX, qrBoxY, qrBoxTam, qrBoxTam, 28);
        ctx.fill();
        ctx.restore();
        ctx.save();
        trazarRectRedondeado(ctx, qrBoxX + 2, qrBoxY + 2, qrBoxTam - 4, qrBoxTam - 4, 26);
        ctx.strokeStyle = "rgba(232, 180, 200, 0.6)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        const qrTam = qrBoxTam - 40;
        ctx.drawImage(fuenteQR, qrBoxX + 20, qrBoxY + 20, qrTam, qrTam);

        cursorY = qrBoxY + qrBoxTam + 54;

        // ---------- Pie ----------
        ctx.fillStyle = "#c98da8";
        ctx.font = "600 23px 'Quicksand', sans-serif";
        ctx.fillText("Escanea para conocer mi historia", centroX, cursorY);

        cursorY += 34;
        ctx.fillStyle = "#a68fce";
        ctx.font = "500 19px 'Quicksand', sans-serif";
        ctx.fillText("29 de junio de 2024  ·  Hecho con amor de Papá ❤️", centroX, cursorY);

        return canvas;
    }

    async function descargarQR() {
        const fuenteQR = obtenerFuenteQR();
        if (!fuenteQR) return;

        downloadBtn.disabled = true;
        downloadBtn.classList.add("is-working");
        const textoOriginal = downloadBtn.textContent;
        downloadBtn.textContent = "Generando tarjeta…";

        try {
            const tarjeta = await construirTarjeta();
            if (!tarjeta) return;

            const link = document.createElement("a");
            link.download = "valeria-maximiliana-tarjeta.png";
            link.href = tarjeta.toDataURL("image/png");
            link.click();
        } catch (err) {
            // Si la fotografía no pudo cargarse (por ejemplo, al abrir el
            // archivo directamente sin servidor local), se informa al usuario
            // en vez de fallar en silencio.
            output.insertAdjacentHTML(
                "afterend",
                "<p style='color:var(--color-text-soft);font-size:0.85rem;text-align:center;'>No se pudo generar la tarjeta con la fotografía. Prueba abriendo el sitio con un servidor local (ver README).</p>"
            );
        } finally {
            downloadBtn.disabled = false;
            downloadBtn.classList.remove("is-working");
            downloadBtn.textContent = textoOriginal;
        }
    }

    generateBtn.addEventListener("click", generarQR);
    downloadBtn.addEventListener("click", descargarQR);
    urlInput.addEventListener("keyup", (e) => {
        if (e.key === "Enter") generarQR();
    });

    // Generar automáticamente uno inicial con el valor de ejemplo.
    generarQR();
})();
</script>
</body>
</html>
